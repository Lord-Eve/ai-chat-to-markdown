<!doctype html><html><head><meta charset="utf-8"><title>History Test</title>
<style>body{margin:0}
.thread-scroll-container{height:600px;overflow-y:auto;position:relative;display:flex;flex-direction:column-reverse}
#spacer{flex-shrink:0;position:relative}[data-content-search-turn-key]{position:absolute;left:0;right:0;height:300px;box-sizing:border-box}</style></head>
<body>
<!-- 登录态新界面的超长会话：打开时只有最近 15 轮，滚到顶才分批向服务器取更早的消息，每批 1.5 秒才回来。
     和真实页面一样，fallback-turn-N 从「当前已加载的第一轮」数起，加载出更早的消息后整体后移。
     第 20 轮用户只发了一张图，气泡里没有文字。
     网址带 ?late 时第一批要 5 秒才回来，脚本已经开始往下收集了。 -->
<main>
  <div id="thread" class="thread-scroll-container overflow-y-auto" data-app-action-timeline-scroll role="region"><div id="spacer"></div></div>
</main>
<script>
const N = 45, BATCH = 15, DELAY = 1500, H = 300, late = location.search.includes('late');
const root = document.getElementById('thread'), spacer = document.getElementById('spacer');
let first = N - BATCH, loading = false, atTop = false, batches = 0;
const mounted = new Map();
function make(i) {
  const n = i + 1, key = 'fallback-turn-' + (i - first);
  const bubble = n === 20 ? '<div class="uploaded-image" style="width:80px;height:60px"></div>' : 'Question ' + n;
  const t = document.createElement('div');
  t.setAttribute('data-content-search-turn-key', key);
  t.innerHTML =
    '<div data-content-search-unit-key="' + key + ':0:user" data-chatgpt-search-message-ids="u' + n + '"><div data-user-message-bubble="true">' + bubble + '</div></div>' +
    '<div data-content-search-unit-key="' + key + ':2:assistant" data-chatgpt-search-message-ids="a' + n + '"><div data-chatgpt-selection-conversation-id="history-test"><div data-markdown-text-style="assistant-message"><p>Answer ' + n + '</p></div></div></div>';
  return t;
}
const fromTop = () => root.scrollTop + root.scrollHeight - root.clientHeight;
function render() {
  const lo = Math.max(first, first + Math.floor((fromTop() - root.clientHeight) / H));
  const hi = Math.min(N - 1, first + Math.ceil((fromTop() + 2 * root.clientHeight) / H));
  for (const [i, el] of mounted) if (i < lo || i > hi) { el.remove(); mounted.delete(i); }
  for (let i = lo; i <= hi; i++) if (!mounted.has(i)) { const el = make(i); spacer.appendChild(el); mounted.set(i, el); }
  for (const [i, el] of mounted) el.style.top = ((i - first) * H) + 'px';
}
// 加载出更早的消息后，已挂载的元素按新的轮次号重新生成
function layout() { spacer.style.height = ((N - first) * H) + 'px'; for (const el of mounted.values()) el.remove(); mounted.clear(); render(); }
// 像 IntersectionObserver 一样，只在「滚进顶部」那一刻触发一次加载
root.addEventListener('scroll', () => {
  render();
  const now = fromTop() < 50;
  if (now && !atTop && !loading && first > 0) {
    loading = true;
    setTimeout(() => { first = Math.max(0, first - BATCH); loading = false; layout(); }, late && batches++ === 0 ? 5000 : DELAY);
  }
  atTop = now;
});
layout();
</script>
</body></html>
